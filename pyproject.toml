[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carbon-lens"
version = "0.1.2"
description = "Read-only CarbonData analysis and export MCP server over SSH"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.13,<2",
  "paramiko>=3.4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
carbon-lens = "carbon_lens.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
